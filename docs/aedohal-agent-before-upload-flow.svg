<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2240" viewBox="0 0 1400 2240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf3ff"/><stop offset=".52" stop-color="#f8f4f5"/><stop offset="1" stop-color="#fff0dc"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafcff"/><stop offset="1" stop-color="#d9e8f8"/></linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf5"/><stop offset="1" stop-color="#f6d3ba"/></linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcf8"/><stop offset="1" stop-color="#d5e8da"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf6"/><stop offset="1" stop-color="#f2e1ad"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8f6"/><stop offset="1" stop-color="#f1c8c0"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#53627a" flood-opacity=".15"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#8b98aa"/></marker>
    <style>
      .title{font:700 40px 'Pretendard','Noto Sans KR',sans-serif;fill:#263752}
      .subtitle{font:500 18px 'Pretendard','Noto Sans KR',sans-serif;fill:#66758b}
      .head{font:700 23px 'Pretendard','Noto Sans KR',sans-serif;fill:#293a56}
      .body{font:500 17px 'Pretendard','Noto Sans KR',sans-serif;fill:#53627a}
      .small{font:500 14px 'Pretendard','Noto Sans KR',sans-serif;fill:#738096}
      .box{stroke:#fff;stroke-width:3;filter:url(#shadow)}
      .line{fill:none;stroke:#8b98aa;stroke-width:3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#9ba7b7;stroke-width:2.5;stroke-dasharray:9 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="2240" rx="44" fill="url(#bg)"/>
  <circle cx="120" cy="170" r="80" fill="#fff" opacity=".28"/>
  <circle cx="1290" cy="2070" r="180" fill="#ffd6b5" opacity=".18"/>

  <text x="700" y="72" text-anchor="middle" class="title">애도할 시간 · 문서 업로드 전 Agent 이용 흐름</text>
  <text x="700" y="107" text-anchor="middle" class="subtitle">정해진 명령어 없이 대화로 시작해, 지금 필요한 문서와 업무를 찾는 과정</text>

  <rect x="390" y="145" width="620" height="88" rx="28" fill="url(#peach)" class="box"/>
  <text x="700" y="180" text-anchor="middle" class="head">서비스 접속 · AI 홈</text>
  <text x="700" y="209" text-anchor="middle" class="body">기존 사용자라면 저장된 CaseState 불러오기</text>
  <path d="M700 233V272" class="line"/>

  <rect x="310" y="272" width="780" height="106" rx="28" fill="url(#blue)" class="box"/>
  <text x="700" y="309" text-anchor="middle" class="head">Agent의 자연스러운 첫 인사</text>
  <text x="700" y="340" text-anchor="middle" class="body">“이미 처리한 일이 있거나 지금 궁금한 점을 편하게 말해줘.”</text>
  <text x="700" y="365" text-anchor="middle" class="small">처음부터 업무 카드와 복잡한 분석 결과를 강제로 띄우지 않음</text>
  <path d="M700 378V418" class="line"/>

  <rect x="260" y="418" width="880" height="110" rx="28" fill="url(#peach)" class="box"/>
  <text x="700" y="455" text-anchor="middle" class="head">사용자 자유 입력</text>
  <text x="700" y="486" text-anchor="middle" class="body">“아직 아무것도 못 했어” · “사망신고는 했어” · “뭘 해야 할지 모르겠어”</text>
  <text x="700" y="514" text-anchor="middle" class="small">버튼을 눌러도 되고 평소 말투로 입력해도 됨</text>
  <path d="M700 528V568" class="line"/>

  <rect x="225" y="568" width="950" height="118" rx="28" fill="url(#blue)" class="box"/>
  <text x="700" y="605" text-anchor="middle" class="head">Solar 문맥 이해 + 사건 상태 조회</text>
  <text x="700" y="637" text-anchor="middle" class="body">의도 · 정서 · 완료/미완료 업무 · 최근 대화 · 현재 집중 업무 판단</text>
  <text x="700" y="669" text-anchor="middle" class="small">“그건 처리했어”처럼 대상이 생략돼도 대화 문맥으로 복원</text>
  <path d="M700 686V728" class="line"/>

  <path d="M700 728L900 800 700 872 500 800Z" fill="url(#amber)" class="box"/>
  <text x="700" y="792" text-anchor="middle" class="head">별도 안전 경로가 필요한가?</text>
  <text x="700" y="822" text-anchor="middle" class="small">즉각적 위험 · 법률 결정 요구 · 쉬고 싶다는 요청</text>

  <path d="M500 800H260V910" class="line"/>
  <text x="390" y="781" class="small">예</text>
  <rect x="65" y="910" width="390" height="122" rx="27" fill="url(#coral)" class="box"/>
  <text x="260" y="946" text-anchor="middle" class="head">안전·휴식 우선 응답</text>
  <text x="260" y="978" text-anchor="middle" class="body">안전 확보 · 법률 결론 차단</text>
  <text x="260" y="1007" text-anchor="middle" class="small">현재 상태를 저장하고 강제로 진행하지 않음</text>

  <path d="M700 872V914" class="line"/>
  <text x="720" y="900" class="small">아니오</text>
  <rect x="480" y="914" width="440" height="88" rx="28" fill="url(#sage)" class="box"/>
  <text x="700" y="949" text-anchor="middle" class="head">최소 기본정보 확인</text>
  <text x="700" y="979" text-anchor="middle" class="body">다음 행동에 필요한 질문을 한 번에 하나씩</text>
  <path d="M700 1002V1042" class="line"/>

  <rect x="160" y="1042" width="1080" height="112" rx="29" fill="#fff" fill-opacity=".72" class="box"/>
  <text x="700" y="1079" text-anchor="middle" class="head">기본 상황 수집</text>
  <text x="700" y="1111" text-anchor="middle" class="body">고인과의 관계 · 지역 · 사망일 · 사망신고 여부 · 보유 문서 · 이미 처리한 업무</text>
  <text x="700" y="1140" text-anchor="middle" class="small">모든 개인정보를 한꺼번에 요구하지 않음</text>
  <path d="M700 1154V1196" class="line"/>

  <path d="M700 1196L900 1268 700 1340 500 1268Z" fill="url(#peach)" class="box"/>
  <text x="700" y="1260" text-anchor="middle" class="head">이미 처리한 업무가 있는가?</text>
  <text x="700" y="1290" text-anchor="middle" class="small">사용자 답변 + 저장된 CaseState 확인</text>

  <path d="M500 1268H290V1382" class="line"/>
  <text x="390" y="1249" class="small">없음·모름</text>
  <rect x="75" y="1382" width="430" height="118" rx="27" fill="url(#amber)" class="box"/>
  <text x="290" y="1418" text-anchor="middle" class="head">시작 업무 생성</text>
  <text x="290" y="1450" text-anchor="middle" class="body">누락된 기본정보 또는 선행 업무 확인</text>
  <text x="290" y="1478" text-anchor="middle" class="small">예: 사망신고 완료 여부 확인</text>

  <path d="M900 1268H1110V1382" class="line"/>
  <text x="1000" y="1249" class="small">있음</text>
  <rect x="895" y="1382" width="430" height="118" rx="27" fill="url(#sage)" class="box"/>
  <text x="1110" y="1418" text-anchor="middle" class="head">완료 상태 반영</text>
  <text x="1110" y="1450" text-anchor="middle" class="body">완료 업무를 COMPLETED로 저장</text>
  <text x="1110" y="1478" text-anchor="middle" class="small">완료된 준비 UI는 다시 표시하지 않음</text>

  <path d="M290 1500V1552H700" class="line"/>
  <path d="M1110 1500V1552H700" class="line"/>
  <rect x="310" y="1552" width="780" height="110" rx="29" fill="url(#blue)" class="box"/>
  <text x="700" y="1589" text-anchor="middle" class="head">가장 중요한 다음 업무 1개 선택</text>
  <text x="700" y="1621" text-anchor="middle" class="body">직접 요청 → 긴급 위험·기한 → 진행 업무 → 누락 정보 → 다음 선행 업무</text>
  <text x="700" y="1649" text-anchor="middle" class="small">여러 업무를 한꺼번에 쏟아내지 않음</text>
  <path d="M700 1662V1704" class="line"/>

  <path d="M700 1704L900 1776 700 1848 500 1776Z" fill="url(#amber)" class="box"/>
  <text x="700" y="1768" text-anchor="middle" class="head">해당 업무에 문서가 필요한가?</text>
  <text x="700" y="1798" text-anchor="middle" class="small">문서 없이 질문·직접 입력으로 진행 가능한지도 확인</text>

  <path d="M500 1776H270V1900" class="line"/>
  <text x="385" y="1757" class="small">문서 없음</text>
  <rect x="55" y="1900" width="430" height="150" rx="27" fill="url(#peach)" class="box"/>
  <text x="270" y="1936" text-anchor="middle" class="head">문서 없는 경로</text>
  <text x="270" y="1968" text-anchor="middle" class="body">발급·조회 방법 안내</text>
  <text x="270" y="1998" text-anchor="middle" class="body">공식 사이트 · 기관 찾기 · 직접 입력</text>
  <text x="270" y="2028" text-anchor="middle" class="small">나중에 올리기 또는 현재 상태 저장</text>

  <path d="M900 1776H1130V1900" class="line"/>
  <text x="1000" y="1757" class="small">문서 보유</text>
  <rect x="915" y="1900" width="430" height="150" rx="27" fill="url(#sage)" class="box"/>
  <text x="1130" y="1936" text-anchor="middle" class="head">문서 업로드 경로</text>
  <text x="1130" y="1968" text-anchor="middle" class="body">종류를 미리 선택하지 않고 업로드</text>
  <text x="1130" y="1998" text-anchor="middle" class="body">개인정보 안내 · 여러 파일 첨부</text>
  <text x="1130" y="2028" text-anchor="middle" class="small">외부 OCR·추출 API로 전달</text>

  <path d="M270 2050V2100H700" class="dash"/>
  <path d="M1130 2050V2100H700" class="line"/>
  <rect x="350" y="2100" width="700" height="92" rx="30" fill="url(#blue)" class="box"/>
  <text x="700" y="2136" text-anchor="middle" class="head">문서 종류별 Agent F1~F7 흐름 진입</text>
  <text x="700" y="2167" text-anchor="middle" class="body">분류 → 확인 → 절차 생성 → 준비 → 공식 처리 → 완료 확인</text>

  <path d="M260 1032C260 1100 100 1100 100 650C100 580 250 580 260 568" class="dash"/>
  <text x="120" y="1080" class="small">필요할 때 다시 이어가기</text>
</svg>
