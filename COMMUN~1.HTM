<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>경험 나눔 · 애도할 시간</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Noto Sans KR', sans-serif; }
  .font-voice { font-family: 'Noto Serif KR', serif; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #e5cdb8; border-radius: 999px; }
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-rose-50 to-orange-50">

  <div class="h-2 w-full bg-gradient-to-r from-rose-300 via-fuchsia-300 to-indigo-300"></div>

  <div class="flex gap-4 p-4 max-w-[1500px] mx-auto">

    <!-- 좌측 사이드바 -->
    <aside class="w-60 shrink-0 bg-white/85 backdrop-blur rounded-3xl p-5 shadow-sm border border-black/5 flex flex-col">
      <div class="flex items-center gap-2 mb-8 px-1">
        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-orange-200 to-rose-200 flex items-center justify-center text-orange-600 text-sm">✦</div>
        <div>
          <p class="text-sm font-semibold text-gray-800 leading-none">애도할 시간</p>
          <p class="text-[11px] text-gray-400 mt-1">당신의 곁에서 함께해요</p>
        </div>
      </div>

      <nav class="flex flex-col gap-1 text-sm">
        <a class="flex items-center gap-3 px-4 py-3 rounded-2xl text-gray-500 hover:bg-gray-50" href="#">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
          AI 홈
        </a>
        <a class="flex items-center gap-3 px-4 py-3 rounded-2xl text-gray-500 hover:bg-gray-50" href="#">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
          내 할 일
        </a>
        <a class="flex items-center gap-3 px-4 py-3 rounded-2xl text-gray-500 hover:bg-gray-50" href="#">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7h5l2 2h11v10H3V7z"/></svg>
          서류함
        </a>
        <a class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-gradient-to-r from-orange-100 to-rose-100 text-orange-700 font-medium" href="#">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-1a4 4 0 00-3-3.87M9 20H4v-1a4 4 0 013-3.87m5-3.13a4 4 0 100-8 4 4 0 000 8zm7 0a4 4 0 10-3.36-6.15"/></svg>
          경험 나눔
        </a>
        <a class="flex items-center gap-3 px-4 py-3 rounded-2xl text-gray-500 hover:bg-gray-50" href="#">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path stroke-linecap="round" d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg>
          내 정보
        </a>
      </nav>

      <div class="mt-auto pt-6 text-[11px] text-gray-400 space-y-1">
        <p class="text-gray-500">도움이 필요하신가요?</p>
        <p>고객센터 1522-0000</p>
        <p class="pt-2 border-t border-gray-100 mt-2">개인정보는 안전하게 보호돼요</p>
      </div>
    </aside>

    <!-- 메인 콘텐츠 -->
    <main class="flex-1 min-w-0 flex flex-col gap-4">

      <div class="bg-white/90 rounded-3xl p-6 shadow-sm border border-black/5 flex items-center justify-between flex-wrap gap-3">
        <div>
          <p class="font-voice text-[11px] tracking-[0.2em] text-gray-400 uppercase mb-1">경험 나눔 · COMMUNITY</p>
          <h1 class="text-2xl font-semibold text-gray-800">다른 가족들의 이야기를 나눠요</h1>
        </div>
        <button class="rounded-full bg-gradient-to-r from-orange-400 to-rose-400 text-white text-sm font-medium px-5 py-2.5 shadow-sm hover:opacity-90 transition">
          + 글쓰기
        </button>
      </div>

      <!-- 카테고리 탭 -->
      <div class="flex gap-2 overflow-x-auto pb-1" id="tabs">
        <button data-cat="all" class="tab-btn px-4 py-2 rounded-full text-sm whitespace-nowrap font-medium bg-gradient-to-r from-orange-200 to-rose-200 text-orange-800 border border-transparent">전체</button>
        <button data-cat="renounce" class="tab-btn px-4 py-2 rounded-full text-sm whitespace-nowrap bg-white text-gray-500 border border-gray-200">상속포기·한정승인</button>
        <button data-cat="tax" class="tab-btn px-4 py-2 rounded-full text-sm whitespace-nowrap bg-white text-gray-500 border border-gray-200">상속세</button>
        <button data-cat="transfer" class="tab-btn px-4 py-2 rounded-full text-sm whitespace-nowrap bg-white text-gray-500 border border-gray-200">명의이전</button>
        <button data-cat="insurance" class="tab-btn px-4 py-2 rounded-full text-sm whitespace-nowrap bg-white text-gray-500 border border-gray-200">보험청구</button>
        <button data-cat="subscription" class="tab-btn px-4 py-2 rounded-full text-sm whitespace-nowrap bg-white text-gray-500 border border-gray-200">통신·구독해지</button>
        <button data-cat="etc" class="tab-btn px-4 py-2 rounded-full text-sm whitespace-nowrap bg-white text-gray-500 border border-gray-200">기타</button>
      </div>

      <!-- 글 목록 -->
      <div class="flex flex-col gap-3" id="post-list"></div>

      <!-- 작성 바 -->
      <div class="bg-white/90 rounded-3xl p-4 shadow-sm border border-black/5 flex items-center gap-3 mt-1">
        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-orange-200 to-rose-200 flex items-center justify-center text-orange-600 text-sm shrink-0">✦</div>
        <input type="text" placeholder="오늘 겪은 일, 도움이 됐던 팁을 나눠주세요" class="flex-1 bg-transparent text-sm outline-none placeholder:text-gray-400" />
        <button class="w-9 h-9 rounded-full bg-gradient-to-r from-orange-400 to-rose-400 text-white flex items-center justify-center shrink-0">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
        </button>
      </div>
      <p class="text-center text-[11px] text-gray-400">AI는 업무 정리를 돕는 안내자예요. 중요한 결정은 전문가와 확인해 주세요.</p>
    </main>

    <!-- 우측 패널 -->
    <aside class="w-72 shrink-0 flex flex-col gap-3">
      <div class="bg-white/90 rounded-3xl p-5 shadow-sm border border-black/5">
        <p class="font-voice text-[11px] tracking-[0.2em] text-gray-400 uppercase mb-1">MY ACTIVITY</p>
        <h2 class="text-lg font-semibold text-gray-800 mb-4">나의 활동</h2>

        <div class="space-y-3">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-gradient-to-br from-emerald-200 to-teal-200 flex items-center justify-center text-teal-700 text-xs">✎</div>
            <div class="flex-1">
              <p class="text-xs text-gray-400">내가 쓴 글</p>
              <p class="text-sm font-semibold text-gray-800">4개</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-gradient-to-br from-amber-100 to-yellow-200 flex items-center justify-center text-amber-700 text-xs">♥</div>
            <div class="flex-1">
              <p class="text-xs text-gray-400">받은 공감</p>
              <p class="text-sm font-semibold text-gray-800">18개</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-gradient-to-br from-rose-100 to-pink-200 flex items-center justify-center text-rose-700 text-xs">✦</div>
            <div class="flex-1">
              <p class="text-xs text-gray-400">AI가 추천한 내 팁</p>
              <p class="text-sm font-semibold text-gray-800">2개</p>
            </div>
          </div>
        </div>
      </div>

      <div class="rounded-2xl bg-gradient-to-r from-orange-400 to-rose-400 text-white text-center py-3 text-sm font-medium shadow-sm">
        ✦ 당신의 경험이 누군가에게 힘이 되고 있어요
      </div>
    </aside>

  </div>

<script>
const POSTS = [
  { id: 1, nickname: '늦가을', category: 'renounce', content: '안심상속 통지서에 캐피탈 대출이 찍혀서 놀랐는데, 지점 방문 없이 우편으로도 상속포기 서류 접수가 됐어요. 3개월 기한 꼭 확인하세요.', createdAt: '2일 전', helpful: 12, aiPicked: true },
  { id: 2, nickname: '해질무렵', category: 'subscription', content: '아버지 명의 통신사 자동이체가 4개나 있었어요. 명의자 사망 시 위약금 면제되는 경우가 많으니 상담원한테 꼭 물어보세요.', createdAt: '3일 전', helpful: 9, aiPicked: true },
  { id: 3, nickname: '작은배', category: 'insurance', content: '보험금 청구할 때 사망진단서 원본 대신 사본도 가능한 보험사가 있더라고요. 콜센터에 먼저 전화로 확인하고 방문했어요.', createdAt: '5일 전', helpful: 6, aiPicked: false },
  { id: 4, nickname: '느린오후', category: 'tax', content: '상속세 신고 전에 세무사 무료 상담을 지역 세무서에서 해줘요. 예약하고 가면 기본적인 방향은 잡을 수 있어요.', createdAt: '1주 전', helpful: 15, aiPicked: false },
  { id: 5, nickname: '먼구름', category: 'transfer', content: '자동차 명의이전, 생각보다 서류가 간단했어요. 상속인 전원 인감 대신 대표상속인 위임장으로도 처리 가능했습니다.', createdAt: '1주 전', helpful: 4, aiPicked: false },
];

const CAT_STYLE = {
  renounce: 'bg-rose-50 text-rose-600',
  tax: 'bg-amber-50 text-amber-700',
  transfer: 'bg-teal-50 text-teal-700',
  insurance: 'bg-indigo-50 text-indigo-600',
  subscription: 'bg-pink-50 text-pink-600',
  etc: 'bg-gray-100 text-gray-500',
};
const CAT_LABEL = {
  renounce: '상속포기·한정승인', tax: '상속세', transfer: '명의이전',
  insurance: '보험청구', subscription: '통신·구독해지', etc: '기타',
};

function render(cat) {
  const list = document.getElementById('post-list');
  const items = cat === 'all' ? POSTS : POSTS.filter(p => p.category === cat);
  list.innerHTML = items.map(p => `
    <div class="bg-white rounded-3xl p-5 shadow-sm border border-black/5">
      <div class="flex items-center gap-3 mb-2">
        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-200 to-rose-200 flex items-center justify-center text-gray-600 text-xs font-medium shrink-0">${p.nickname[0]}</div>
        <p class="text-sm font-medium text-gray-700">${p.nickname}</p>
        <p class="text-xs text-gray-400">${p.createdAt}</p>
        <span class="ml-auto text-[11px] px-2.5 py-1 rounded-full font-medium ${CAT_STYLE[p.category]}">${CAT_LABEL[p.category]}</span>
      </div>
      <p class="text-sm text-gray-600 leading-relaxed">${p.content}</p>
      <div class="flex items-center gap-3 mt-3">
        <span class="text-xs text-gray-400">♥ 공감 ${p.helpful}</span>
        ${p.aiPicked ? '<span class="text-[11px] text-orange-500 bg-orange-50 rounded-full px-2 py-1 inline-flex items-center gap-1">✦ AI 추천 팁</span>' : ''}
      </div>
    </div>
  `).join('');
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.className = 'tab-btn px-4 py-2 rounded-full text-sm whitespace-nowrap bg-white text-gray-500 border border-gray-200';
  });
  btn.className = 'tab-btn px-4 py-2 rounded-full text-sm whitespace-nowrap font-medium bg-gradient-to-r from-orange-200 to-rose-200 text-orange-800 border border-transparent';
  render(btn.dataset.cat);
});

render('all');
</script>
</body>
</html>
